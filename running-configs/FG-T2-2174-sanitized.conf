# FortiGate configuration - sanitized public extract
# Device: FG-T2-2174 / FortiGate-VM64-KVM
# FortiOS: 7.0.9
# SECURITY: credentials, encrypted passwords, certificates and private keys are intentionally omitted.

config system interface
    edit "port1"
        set ip 21.74.3.2 255.255.255.252
        set allowaccess ping
        set alias "WAN-ISP"
        set role wan
    next
    edit "port2"
        set type physical
    next
    edit "port3"
        set ip 192.168.79.99 255.255.255.0
        set allowaccess ping https http
        set type physical
    next
    edit "VLAN10-USERS"
        set ip 10.21.74.1 255.255.255.128
        set allowaccess ping
        set role lan
        set interface "port2"
        set vlanid 10
    next
    edit "VPN-FG-CISCO"
        set type tunnel
        set interface "port1"
    next
end

config system dhcp server
    edit 2
        set default-gateway 10.21.74.1
        set netmask 255.255.255.128
        set interface "VLAN10-USERS"
        config ip-range
            edit 1
                set start-ip 10.21.74.10
                set end-ip 10.21.74.100
            next
        end
        set dns-server1 8.8.8.8
        set dns-server2 1.1.1.1
    next
end

config firewall address
    edit "VPN-FG-CISCO_local_subnet_1"
        set allow-routing enable
        set subnet 10.21.74.0 255.255.255.128
    next
    edit "VPN-FG-CISCO_remote_subnet_1"
        set allow-routing enable
        set subnet 10.21.74.128 255.255.255.240
    next
end

config firewall addrgrp
    edit "VPN-FG-CISCO_local"
        set member "VPN-FG-CISCO_local_subnet_1"
        set allow-routing enable
    next
    edit "VPN-FG-CISCO_remote"
        set member "VPN-FG-CISCO_remote_subnet_1"
        set allow-routing enable
    next
end

config vpn ipsec phase1-interface
    edit "VPN-FG-CISCO"
        set interface "port1"
        set peertype any
        set net-device disable
        set proposal des-md5 des-sha1
        set remote-gw 21.74.4.2
        set psksecret "<REDACTED_PSK>"
    next
end

config vpn ipsec phase2-interface
    edit "VPN-FG-CISCO"
        set phase1name "VPN-FG-CISCO"
        set proposal des-md5 des-sha1
        set src-addr-type name
        set dst-addr-type name
        set src-name "VPN-FG-CISCO_local"
        set dst-name "VPN-FG-CISCO_remote"
    next
end

config firewall policy
    edit 1
        set name "USER-TO-INTERNET"
        set srcintf "VLAN10-USERS"
        set dstintf "port1"
        set action accept
        set srcaddr "all"
        set dstaddr "all"
        set schedule "always"
        set service "ALL"
        set logtraffic all
        set nat enable
    next
    edit 2
        set name "vpn_VPN-FG-CISCO_local_0"
        set srcintf "VLAN10-USERS"
        set dstintf "VPN-FG-CISCO"
        set action accept
        set srcaddr "VPN-FG-CISCO_local"
        set dstaddr "VPN-FG-CISCO_remote"
        set schedule "always"
        set service "ALL"
    next
    edit 3
        set name "vpn_VPN-FG-CISCO_remote_0"
        set srcintf "VPN-FG-CISCO"
        set dstintf "VLAN10-USERS"
        set action accept
        set srcaddr "VPN-FG-CISCO_remote"
        set dstaddr "VPN-FG-CISCO_local"
        set schedule "always"
        set service "ALL"
    next
end

config router static
    edit 1
        set gateway 21.74.3.1
        set device "port1"
    next
    edit 2
        set device "VPN-FG-CISCO"
        set dstaddr "VPN-FG-CISCO_remote"
    next
    edit 3
        set distance 254
        set blackhole enable
        set dstaddr "VPN-FG-CISCO_remote"
    next
end
